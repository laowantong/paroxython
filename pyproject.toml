[project]
name = "paroxython"
version = "0.7.3"
description = "Search Python code for algorithmic features"
authors = [{name = "Aristide Grange"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8,<4.0"
dependencies = [
    "docopt>=0.6.2,<0.7",
    "regex>=2022.8.17",
    "typing-extensions>=4.3.0",
]
keywords = ["education",
            "static-analysis",
            "algorithmic",
            "metaprogramming",
            "python",
            "taxonomic-classification",
            "knowledge-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: IPython",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Education",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "mypy>=0.782",
    "pdoc3>=0.9.1,<0.10",
    "pre-commit>=2.20.0",
    "pytest>=7.1.3",
    "pytest-cov>=4",
    "sqlparse>=0.4.2",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.urls]
homepage = "https://github.com/laowantong/paroxython/"
repository = "https://github.com/laowantong/paroxython/"
issues = "https://github.com/laowantong/paroxython/issues"

[project.scripts]
paroxython = 'paroxython.cli:main'
